# Publishes one package when a release tag is pushed:
#   js-v1.0.0      -> npm   @a2ztools/api
#   python-v1.0.0  -> PyPI  a2ztools
#   dotnet-v1.0.0  -> NuGet A2zTools.Api
# PHP needs no job: Packagist reads the tags of this repository (tag v1.0.0).
#
# No long-lived tokens are stored. Each registry trusts this workflow through
# OpenID Connect ("trusted publishing"), set up once on the registry:
#   npm:   package settings -> Trusted publisher -> GitHub Actions, a2ztoolsdev-source/a2ztools, publish.yml
#   PyPI:  account -> Publishing -> add pending publisher (project a2ztools, workflow publish.yml, environment pypi)
#   NuGet: account -> Trusted publishing -> a2ztoolsdev-source/a2ztools, publish.yml (policy a2ztools-github, user a2ztools)
name: Publish

on:
  push:
    tags: ['js-v*', 'python-v*', 'dotnet-v*']

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'js-v')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: packages/js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest
      - run: npm test
      - name: Check the tag matches package.json
        run: test "js-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --access public --provenance

  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: packages/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build pytest && pip install -e . && pytest -q
      - name: Check the tag matches the version
        run: test "python-v$(python -c 'import a2ztools; print(a2ztools.__version__)')" = "${GITHUB_REF_NAME}"
      - run: cp ../../LICENSE . && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: packages/python/dist }

  nuget:
    if: startsWith(github.ref_name, 'dotnet-v')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: packages/dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test test/A2zTools.Api.Tests/A2zTools.Api.Tests.csproj
      - run: dotnet pack src/A2zTools.Api/A2zTools.Api.csproj -c Release -o out -p:Version=${GITHUB_REF_NAME#dotnet-v}
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with: { user: a2ztools }  # nuget.org profile name, not a secret
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
